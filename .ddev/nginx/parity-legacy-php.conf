# Local parity replay only: send the legacy vBulletin .php URLs to Laravel as production's nginx does
# (lara-forum docs/vbulletin-legacy-url-redirect-strategy.md). Prefix locations (^~) beat the generic \.php$ regex.
location ^~ /attachment.php {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param SERVER_NAME $host;
    fastcgi_param HTTPS $fcgi_https;
    fastcgi_read_timeout 10m;
}
