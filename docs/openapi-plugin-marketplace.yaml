openapi: 3.1.0
info:
  title: Zen Cart Plugin Marketplace API
  version: "1.0.0"
  summary: Read-oriented marketplace API for plugin catalog, releases, downloads, and update checks.
  description: |
    This OpenAPI document defines the public marketplace-consumption surface for the plugin API.

    Included here:
    - plugin type discovery
    - plugin catalog and detail reads
    - release listing and exact release detail
    - download metadata
    - update checks
    - optional subscription endpoints

    Explicitly out of scope for this contract:
    - owner management endpoints
    - release submission endpoints
    - staff moderation endpoints
    - auto-publish or broader operator workflows

    Public read endpoints can be called anonymously. When a Sanctum bearer token is supplied, the token
    must include the documented ability and the authenticated user may see entitlement-expanded results.
servers:
  - url: https://support.zen-cart.com
    description: Production example
  - url: http://localhost
    description: Local example
tags:
  - name: Plugin Types
  - name: Plugins
  - name: Releases
  - name: Downloads
  - name: Updates
  - name: Subscriptions
paths:
  /api/v1/plugin-types:
    get:
      tags: [Plugin Types]
      summary: List visible plugin types
      description: |
        Returns active plugin types visible to the current requester.
        Anonymous users only receive types that do not require an entitlement.
      security:
        - {}
        - sanctumBearer: [plugins:read]
      responses:
        "200":
          description: Plugin types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginTypeCollectionResponse"
  /api/v1/plugins:
    get:
      tags: [Plugins]
      summary: List visible plugins
      description: |
        Returns the public plugin catalog. This contract documents the marketplace-facing public view only.
      security:
        - {}
        - sanctumBearer: [plugins:read]
      parameters:
        - in: query
          name: q
          description: Search plugin name, slug, and description.
          schema:
            type: string
            maxLength: 255
        - in: query
          name: type
          description: Filter by plugin type slug.
          schema:
            type: string
            maxLength: 255
        - in: query
          name: page
          description: 1-based pagination page.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: encapsulated
          description: Filter by the latest active release encapsulation state.
          schema:
            type: string
            enum: [all, yes, no, unknown]
      responses:
        "200":
          description: Paginated plugin catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPluginSummaryResponse"
  /api/v1/plugins/{slug}:
    get:
      tags: [Plugins]
      summary: Get one visible plugin
      security:
        - {}
        - sanctumBearer: [plugins:read]
      parameters:
        - $ref: "#/components/parameters/PluginSlug"
      responses:
        "200":
          description: Plugin detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/plugins/{slug}/releases:
    get:
      tags: [Releases]
      summary: List visible releases for a plugin
      security:
        - {}
        - sanctumBearer: [plugins:read]
      parameters:
        - $ref: "#/components/parameters/PluginSlug"
      responses:
        "200":
          description: Release list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginReleaseCollectionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/plugins/{slug}/releases/{version}:
    get:
      tags: [Releases]
      summary: Get exact visible release detail
      security:
        - {}
        - sanctumBearer: [plugins:read]
      parameters:
        - $ref: "#/components/parameters/PluginSlug"
        - $ref: "#/components/parameters/ReleaseVersion"
      responses:
        "200":
          description: Release detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginReleaseResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/plugins/{slug}/download/{version}:
    get:
      tags: [Downloads]
      summary: Get exact release download metadata
      description: |
        Returns metadata for one visible release. `download_url` is omitted (`null`) when the requester
        cannot actually download the release.
      security:
        - {}
        - sanctumBearer: [plugins:read, plugins:download]
      parameters:
        - $ref: "#/components/parameters/PluginSlug"
        - $ref: "#/components/parameters/ReleaseVersion"
      responses:
        "200":
          description: Download metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadMetadataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/plugins/updates:
    post:
      tags: [Updates]
      summary: Check installed plugins for available updates
      description: |
        Accepts installed inventory keyed by `slug` or `legacy_vbulletin_file_id` and returns only plugins
        with newer visible compatible releases.
      security:
        - {}
        - sanctumBearer: [plugins:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCheckRequest"
      responses:
        "200":
          description: Update check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheckResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/plugins/{slug}/subscription:
    get:
      tags: [Subscriptions]
      summary: Get subscription state for the authenticated user
      description: Optional user-specific marketplace endpoint.
      security:
        - sanctumBearer: [plugins:read]
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginSlug"
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Subscriptions]
      summary: Subscribe the authenticated user to plugin release updates
      description: Optional user-specific marketplace endpoint.
      security:
        - sanctumBearer: [plugins:write]
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginSlug"
      responses:
        "200":
          description: Updated subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Subscriptions]
      summary: Unsubscribe the authenticated user from plugin release updates
      description: Optional user-specific marketplace endpoint.
      security:
        - sanctumBearer: [plugins:write]
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginSlug"
      responses:
        "200":
          description: Updated subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Sanctum personal access token. When used on documented read endpoints, include `plugins:read`.
    sessionAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Browser session authentication for first-party clients.
  parameters:
    PluginSlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
      description: Plugin slug.
    ReleaseVersion:
      in: path
      name: version
      required: true
      schema:
        type: string
      description: Exact plugin release version.
  responses:
    Unauthenticated:
      description: Authentication required or bearer token invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          examples:
            unauthenticated:
              value:
                message: Unauthenticated.
    Forbidden:
      description: Authenticated but not allowed for the requested capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    NotFound:
      description: Record not found or not visible to the current requester.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
  schemas:
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/MessageResponse"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    ResourceCollectionLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
    ResourceCollectionMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        path:
          type: string
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
    PluginType:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - position
        - requires_entitlement
        - active_plugins_count
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        position:
          type: integer
        requires_entitlement:
          type: boolean
        active_plugins_count:
          type: integer
    PluginTypeCollectionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PluginType"
    PluginTypeReference:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    OwnerReference:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
    ForumThreadReference:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
    LatestReleaseSummary:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        version:
          type: string
        status:
          type: string
        encapsulated:
          type: string
          enum: [unknown, yes, no]
          nullable: true
        download_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
    PluginSummary:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - description
        - github_repository_url
        - active_releases_count
        - url
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        status:
          type: string
        description:
          type: string
        github_repository_url:
          type: string
          nullable: true
        active_releases_count:
          type: integer
        encapsulated:
          type: string
          enum: [unknown, yes, no]
          nullable: true
        type:
          $ref: "#/components/schemas/PluginTypeReference"
        owner:
          $ref: "#/components/schemas/OwnerReference"
        forum_thread:
          $ref: "#/components/schemas/ForumThreadReference"
        latest_release:
          $ref: "#/components/schemas/LatestReleaseSummary"
        url:
          type: string
          format: uri
        download_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    PluginReleaseZcVersion:
      type: object
      properties:
        id:
          type: integer
        version:
          type: string
    PluginRelease:
      type: object
      required:
        - id
        - version
        - status
        - internal_version
        - changelog
        - plugin_slug
        - zc_versions
      properties:
        id:
          type: integer
        version:
          type: string
        status:
          type: string
        internal_version:
          type: integer
        changelog:
          type: string
        encapsulated:
          type: string
          enum: [unknown, yes, no]
          nullable: true
        zip_filename:
          type: string
        zip_size:
          type: integer
          nullable: true
        checksum_sha256:
          type: string
        plugin_slug:
          type: string
        download_url:
          type: string
          format: uri
          nullable: true
        zc_versions:
          type: array
          items:
            $ref: "#/components/schemas/PluginReleaseZcVersion"
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    PluginDetail:
      allOf:
        - $ref: "#/components/schemas/PluginSummary"
        - type: object
          properties:
            releases:
              type: array
              items:
                $ref: "#/components/schemas/PluginRelease"
    PaginatedPluginSummaryResponse:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PluginSummary"
        links:
          $ref: "#/components/schemas/ResourceCollectionLinks"
        meta:
          $ref: "#/components/schemas/ResourceCollectionMeta"
    PluginDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PluginDetail"
    PluginReleaseCollectionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PluginRelease"
    PluginReleaseResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PluginRelease"
    DownloadMetadata:
      type: object
      required:
        - plugin_slug
        - plugin_name
        - version
        - status
        - zip_filename
        - checksum_sha256
        - download_count
        - zc_versions
      properties:
        plugin_slug:
          type: string
        plugin_name:
          type: string
        version:
          type: string
        status:
          type: string
        zip_filename:
          type: string
        zip_size:
          type: integer
          nullable: true
        checksum_sha256:
          type: string
        download_count:
          type: integer
        download_url:
          type: string
          format: uri
          nullable: true
        zc_versions:
          type: array
          items:
            $ref: "#/components/schemas/PluginReleaseZcVersion"
        published_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    DownloadMetadataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DownloadMetadata"
    UpdateInventoryRow:
      type: object
      required: [version]
      properties:
        slug:
          type: string
          nullable: true
        legacy_vbulletin_file_id:
          type: integer
          nullable: true
        version:
          type: string
    UpdateCheckRequest:
      type: object
      required: [plugins]
      properties:
        store:
          type: object
          nullable: true
          properties:
            zen_cart_version:
              type: string
              nullable: true
            php_version:
              type: string
              nullable: true
        plugins:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/UpdateInventoryRow"
    UpdateCheckRelease:
      type: object
      properties:
        version:
          type: string
        status:
          type: string
        changelog:
          type: string
        checksum_sha256:
          type: string
        download_url:
          type: string
          format: uri
          nullable: true
        zc_versions:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
        published_at:
          type: string
          format: date-time
          nullable: true
    UpdateCheckRow:
      type: object
      properties:
        slug:
          type: string
        legacy_vbulletin_file_id:
          type: integer
          nullable: true
        installed_version:
          type: string
        update_available:
          type: boolean
        latest_compatible_release:
          $ref: "#/components/schemas/UpdateCheckRelease"
    UpdateCheckResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UpdateCheckRow"
        meta:
          type: object
          properties:
            zen_cart_version:
              type: string
              nullable: true
    SubscriptionState:
      type: object
      required: [plugin_slug, subscribed]
      properties:
        plugin_slug:
          type: string
        subscribed:
          type: boolean
    SubscriptionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SubscriptionState"
